<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="동네오븐 베이커리의 빵 메뉴, 매장 정보와 고객 커뮤니티"><title>고객 커뮤니티 | 동네오븐 베이커리</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><a href="#main" class="skip">본문으로 건너뛰기</a><header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html"><span class="brand-dot" aria-hidden="true">◒</span> 동네오븐<span class="brand-small">BAKERY</span></a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">메뉴</button><nav id="primary-nav" aria-label="주 메뉴"><a href="index.html" >홈</a><a href="menu.html" >빵 메뉴</a><a href="about.html" >매장 이야기</a><a href="community.html" aria-current="page">고객 커뮤니티</a><a href="visit.html" >방문 안내</a></nav></div></header><main id="main"><section class="wrap section"><div class="intro"><h1>고객 커뮤니티</h1><p>맛있게 드신 빵을 알려주세요. 궁금한 점은 매장에 물어보세요.</p></div><p id="status" role="status"></p><a class="board-shortcut button" href="#write-panel">글쓰기</a><div class="board-layout"><div><div class="filters" aria-label="게시판 분류"><button data-filter="" aria-pressed="true">전체</button><button data-filter="review" aria-pressed="false">빵 후기</button><button data-filter="question" aria-pressed="false">매장에 질문</button><button data-filter="notice" aria-pressed="false">매장 소식</button></div><label class="board-search">게시글 검색<input id="board-search" type="search" placeholder="제목, 내용 또는 닉네임" maxlength="100"></label><div id="posts" class="posts" aria-live="polite"></div></div><aside class="panel" id="write-panel" tabindex="-1"><form id="account"><h2>커뮤니티 로그인</h2><label>닉네임<input name="name" required minlength="2" maxlength="24" autocomplete="username"></label><label>비밀번호<input type="password" name="password" required minlength="8" maxlength="128" autocomplete="current-password"></label><div class="actions"><button class="button" value="login">로그인</button><button class="button outline dark" value="register">가입</button></div><small>처음이라면 닉네임과 8자 이상의 비밀번호를 입력하고 가입하세요.</small></form><form id="compose" hidden><h2>새 글 쓰기</h2><div class="account-line"><span id="nickname"></span><button type="button" id="logout" class="link-button">로그아웃</button></div><label>게시판<select name="kind"><option value="review">빵 후기</option><option value="question">매장에 질문</option><option value="notice" hidden disabled>매장 소식</option></select></label><label>제목<input name="title" required maxlength="80"></label><label>내용<textarea name="body" required maxlength="2000" rows="5"></textarea></label><small>닉네임과 글이 공개됩니다. 연락처나 주문 정보는 입력하지 마세요.</small><button class="button">게시하기</button></form></aside></div></section></main><footer><div class="wrap footer-inner"><strong>동네오븐 베이커리</strong><span>매장 홍보용 시안 · 제품 이미지는 연출 예시입니다.</span><a href="community.html">고객 커뮤니티</a></div></footer></body></html>
